image: lorisleiva/laravel-docker:8.4

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
      when: always
    - when: never

stages:
  - prepare
  - quality
  - release
  - split

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  GIT_DEPTH: "0"
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  npm_config_cache: "$CI_PROJECT_DIR/.npm-cache"
  RELEASE_BUMP: "patch"
  RELEASE_TAG_OVERRIDE: ""
  FORCE_PACKAGE_SPLIT: "0"
  RELEASE_GIT_USER_NAME: "otgh-ci-bot"
  RELEASE_GIT_USER_EMAIL: "ci-bot@otgh.cloud"

.cache_php_push: &cache_php_push
  key:
    files:
      - composer.lock
    prefix: php-8.4
  paths:
    - vendor/
    - .composer-cache/
  policy: pull-push

.cache_php_pull: &cache_php_pull
  key:
    files:
      - composer.lock
    prefix: php-8.4
  paths:
    - vendor/
    - .composer-cache/
  policy: pull

.cache_node_push: &cache_node_push
  key:
    files:
      - package-lock.json
    prefix: node-20
  paths:
    - node_modules/
    - .npm-cache/
  policy: pull-push

.cache_node_pull: &cache_node_pull
  key:
    files:
      - package-lock.json
    prefix: node-20
  paths:
    - node_modules/
    - .npm-cache/
  policy: pull

deps:php:
  stage: prepare
  cache:
    - *cache_php_push
  before_script:
    - install-php-extensions sockets
    - echo 'memory_limit = 1024M' >> /usr/local/etc/php/conf.d/docker-php-memory-limit.ini
  script:
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts
  artifacts:
    expire_in: 1 week
    paths:
      - vendor/

deps:node:
  stage: prepare
  cache:
    - *cache_node_push
  script:
    - npm ci --no-audit --no-fund
    - cp .env.testing .env
  artifacts:
    expire_in: 1 week
    paths:
      - node_modules/

lint:php:
  stage: quality
  needs:
    - job: deps:php
      artifacts: true
  cache:
    - *cache_php_pull
  before_script:
    - install-php-extensions sockets
    - echo 'memory_limit = 1024M' >> /usr/local/etc/php/conf.d/docker-php-memory-limit.ini
  script:
    - ./vendor/bin/pint --test

