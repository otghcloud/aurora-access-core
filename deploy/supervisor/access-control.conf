[program:access-control-queue]
command=/usr/bin/php8.5 /home/leebrooks/dev/aurora/internal/products/access-control/artisan queue:work redis --queue=default --sleep=1 --tries=3 --max-time=3600 --timeout=120
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
user=www-data
directory=/home/leebrooks/dev/aurora/internal/products/access-control
redirect_stderr=true
stdout_logfile=/home/leebrooks/dev/aurora/internal/products/access-control/storage/logs/supervisor-queue.log
stopwaitsecs=3600

[program:access-control-mqtt-monitor]
command=/usr/bin/php8.5 /home/leebrooks/dev/aurora/internal/products/access-control/artisan app:monitor-reader-push --connection=monitor --qos=0
autostart=true
autorestart=true
startsecs=2
startretries=10
user=www-data
directory=/home/leebrooks/dev/aurora/internal/products/access-control
redirect_stderr=true
stdout_logfile=/home/leebrooks/dev/aurora/internal/products/access-control/storage/logs/supervisor-mqtt-monitor.log
stopasgroup=true
killasgroup=true
